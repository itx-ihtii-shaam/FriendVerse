<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FriendVerse - 3D Virtual World</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h2 { margin: 0 0 5px 0; color: #00ffcc; }
    </style>
</head>
<body>
    <div id="ui">
        <h2>FriendVerse 🌟</h2>
        <p>Use <b>W, A, S, D</b> keys to move your Avatar!</p>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const socket = io();
        let scene, camera, renderer;
        let myAvatar, otherAvatars = {};
        let keys = {};

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Ground
            const groundGeo = new THREE.PlaneGeometry(120, 120);
            const groundMat = new THREE.MeshBasicMaterial({ color: 0x2e8b57 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            // Lighting
            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(10, 20, 10);
            scene.add(light);

            camera.position.set(0, 6, 12);
            camera.lookAt(0, 0, 0);

            window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
            window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

            animate();
        }

        function createAvatar(color) {
            const geometry = new THREE.BoxGeometry(1, 2, 1);
            const material = new THREE.MeshBasicMaterial({ color: color });
            return new THREE.Mesh(geometry, material);
        }

        socket.on('currentPlayers', (players) => {
            Object.keys(players).forEach(id => {
                if (id === socket.id && !myAvatar) {
                    myAvatar = createAvatar(0x00ff00); // Green for self
                    myAvatar.position.set(0, 1, 0);
                    scene.add(myAvatar);
                } else if (id !== socket.id && !otherAvatars[id]) {
                    const avatar = createAvatar(0xff3333); // Red for others
                    avatar.position.set(players[id].x, players[id].y, players[id].z);
                    scene.add(avatar);
                    otherAvatars[id] = avatar;
                }
            });
        });

        socket.on('playerMoved', (data) => {
            if (otherAvatars[data.id]) {
                otherAvatars[data.id].position.set(data.position.x, data.position.y, data.position.z);
            }
        });

        socket.on('playerDisconnected', (id) => {
            if (otherAvatars[id]) {
                scene.remove(otherAvatars[id]);
                delete otherAvatars[id];
            }
        });

        function animate() {
            requestAnimationFrame(animate);

            if (myAvatar) {
                let moved = false;
                const speed = 0.12;

                if (keys['w']) { myAvatar.position.z -= speed; moved = true; }
                if (keys['s']) { myAvatar.position.z += speed; moved = true; }
                if (keys['a']) { myAvatar.position.x -= speed; moved = true; }
                if (keys['d']) { myAvatar.position.x += speed; moved = true; }

                if (moved) {
                    camera.position.x = myAvatar.position.x;
                    camera.position.z = myAvatar.position.z + 12;
                    
                    socket.emit('playerMove', {
                        x: myAvatar.position.x,
                        y: myAvatar.position.y,
                        z: myAvatar.position.z
                    });
                }
            }

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
