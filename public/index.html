<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FriendVerse - 3D Virtual World</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            background: rgba(0, 0, 0, 0.75);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            max-width: 300px;
        }
        h2 { margin: 0 0 5px 0; color: #00ffcc; }
        #chat-box {
            margin-top: 10px;
            max-height: 100px;
            overflow-y: auto;
            font-size: 13px;
            background: rgba(255,255,255,0.1);
            padding: 5px;
            border-radius: 5px;
        }
        .controls-hint { font-size: 12px; color: #aaa; margin-top: 5px; }
    </style>
</head>
<body>
    <div id="ui">
        <h2>FriendVerse 🌟</h2>
        <p><b>W, A, S, D</b> to Move | <b>Space</b> to Jump</p>
        <div class="controls-hint">Press <b>F</b> to Fight/Action, <b>C</b> to Wave!</div>
        <div id="chat-box"><b>System:</b> Welcome to FriendVerse!</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const socket = io();
        let scene, camera, renderer;
        let myAvatar, otherAvatars = {};
        let keys = {};
        let worldObjects = [];

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // Sky blue
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // --- Lighting ---
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
            sunLight.position.set(50, 100, 50);
            sunLight.castShadow = true;
            scene.add(sunLight);

            // --- Ground / Park ---
            const groundGeo = new THREE.PlaneGeometry(200, 200);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x3b7a57 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // --- Add Real Trees ---
            for (let i = -80; i <= 80; i += 20) {
                for (let j = -80; j <= 80; j += 20) {
                    if (Math.abs(i) > 10 || Math.abs(j) > 10) { // Keep center clear
                        createTree(i + (Math.random()*10 - 5), j + (Math.random()*10 - 5));
                    }
                }
            }

            camera.position.set(0, 5, 10);
            window.addEventListener('keydown', e => handleKeyDown(e));
            window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

            animate();
        }

        // Procedural Detailed Humanoid / Cartoon Avatar
        function createHumanoidAvatar(shirtColor = 0x00ffcc) {
            const group = new THREE.Group();

            // Head
            const headGeo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac }); // Skin tone
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 2.2;
            group.add(head);

            // Torso (Shirt)
            const bodyGeo = new THREE.BoxGeometry(0.8, 1.0, 0.4);
            const bodyMat = new THREE.MeshStandardMaterial({ color: shirtColor });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.3;
            group.add(body);

            // Legs
            const legGeo = new THREE.BoxGeometry(0.35, 0.9, 0.35);
            const legMat = new THREE.MeshStandardMaterial({ color: 0x3333ff }); // Pants
            
            const leftLeg = new THREE.Mesh(legGeo, legMat);
            leftLeg.position.set(-0.2, 0.45, 0);
            group.add(leftLeg);

            const rightLeg = new THREE.Mesh(legGeo, legMat);
            rightLeg.position.set(0.2, 0.45, 0);
            group.add(rightLeg);

            return group;
        }

        // Real Looking Procedural Trees
        function createTree(x, z) {
            const treeGroup = new THREE.Group();

            // Trunk
            const trunkGeo = new THREE.CylinderGeometry(0.4, 0.6, 4, 8);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 2;
            treeGroup.add(trunk);

            // Leaves (Multiple spheres for fluffy cartoon look)
            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x228b22 });
            const leaves1 = new THREE.Mesh(new THREE.SphereGeometry(2, 8, 8), leavesMat);
            leaves1.position.y = 4.5;
            treeGroup.add(leaves1);

            treeGroup.position.set(x, 0, z);
            scene.add(treeGroup);
        }

        function handleKeyDown(e) {
            const key = e.key.toLowerCase();
            keys[key] = true;

            // Action / Fight trigger (F key)
            if (key === 'f' && myAvatar) {
                socket.emit('playerAction', { action: 'fight' });
                logChat('You threw a playful punch / action!');
            }
            // Wave trigger (C key)
            if (key === 'c' && myAvatar) {
                socket.emit('playerAction', { action: 'wave' });
                logChat('You waved at everyone!');
            }
        }

        function logChat(msg) {
            const box = document.getElementById('chat-box');
            box.innerHTML += `<br>${msg}`;
            box.scrollTop = box.scrollHeight;
        }

        // --- Socket Multiplayer Sync ---
        socket.on('currentPlayers', (players) => {
            Object.keys(players).forEach(id => {
                if (id === socket.id && !myAvatar) {
                    myAvatar = createHumanoidAvatar(0x00ffcc); // Cyan shirt for self
                    myAvatar.position.set(0, 0, 0);
                    scene.add(myAvatar);
                } else if (id !== socket.id && !otherAvatars[id]) {
                    const avatar = createHumanoidAvatar(0xff3366); // Pink shirt for others
                    avatar.position.set(players[id].x, players[id].y, players[id].z);
                    scene.add(avatar);
                    otherAvatars[id] = avatar;
                }
            });
        });

        socket.on('playerMoved', (data) => {
            if (otherAvatars[data.id]) {
                otherAvatars[data.id].position.set(data.position.x, data.position.y, data.position.z);
            }
        });

        socket.on('playerActionBroadcast', (data) => {
            if (data.action === 'fight') {
                logChat(`Player ${data.id.substr(0,4)} did a fighting move! 💥`);
            } else if (data.action === 'wave') {
                logChat(`Player ${data.id.substr(0,4)} is waving! 👋`);
            }
        });

        socket.on('playerDisconnected', (id) => {
            if (otherAvatars[id]) {
                scene.remove(otherAvatars[id]);
                delete otherAvatars[id];
                logChat(`A player left the world.`);
            }
        });

        // --- Game Loop ---
        function animate() {
            requestAnimationFrame(animate);

            if (myAvatar) {
                let moved = false;
                const speed = 0.15;

                if (keys['w']) { myAvatar.position.z -= speed; moved = true; }
                if (keys['s']) { myAvatar.position.z += speed; moved = true; }
                if (keys['a']) { myAvatar.position.x -= speed; moved = true; }
                if (keys['d']) { myAvatar.position.x += speed; moved = true; }

                if (moved) {
                    // Smooth Camera Follow
                    camera.position.x = myAvatar.position.x;
                    camera.position.z = myAvatar.position.z + 10;
                    camera.position.y = myAvatar.position.y + 5;
                    camera.lookAt(myAvatar.position.x, myAvatar.position.y + 1, myAvatar.position.z);

                    socket.emit('playerMove', {
                        x: myAvatar.position.x,
                        y: myAvatar.position.y,
                        z: myAvatar.position.z
                    });
                }
            }

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
